
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sudoku</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background-color: #f9f9f9;
                margin: 0;
            }
            table {
                border-collapse: collapse;
                margin: 20px;
            }
            td {
                width: 40px;
                height: 40px;
                text-align: center;
                vertical-align: middle;
                font-size: 20px;
                font-family: Arial, sans-serif;
                border: 1px solid #000;
            }
            /* Edges of the entire Sudoku grid */
            .bold-right {
                border-right: 2px solid #000;
            }
            .bold-bottom {
                border-bottom: 2px solid #000;
            }
            .bold-left {
                border-left: 2px solid #000;
            }
            .bold-top {
                border-top: 2px solid #000;
            }
        </style>
    </head>
    <body>
        <table>
    <tr><td class='bold-top bold-left'>1</td><td class='bold-top'>2</td><td class='bold-top'>4</td><td class='bold-top bold-right'>3</td></tr><tr><td class='bold-left'>3</td><td class=''>4</td><td class=''>2</td><td class='bold-right'>1</td></tr><tr><td class='bold-left'>4</td><td class=''>3</td><td class=''>1</td><td class='bold-right'>2</td></tr><tr><td class='bold-left bold-bottom'>2</td><td class='bold-bottom'>1</td><td class='bold-bottom'>3</td><td class='bold-right bold-bottom'>4</td></tr><tr></tr>
        </table>
    </body>
    </html>
